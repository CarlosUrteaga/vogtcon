[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vogtcon"
version = "0.2.0"
description = "Contratos deterministas y control de herramientas para agentes."
readme = "README.es.md"
authors = [{name = "Jorge Carlos Urteaga Reyesvera"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "opentelemetry-api>=1,<2"]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim>=1,<3"]

[project.scripts]
vogtcon = "vogtcon.cli:main"

[project.urls]
Repository = "https://github.com/CarlosUrteaga/vogtcon"

[dependency-groups]
test = ["opentelemetry-sdk>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

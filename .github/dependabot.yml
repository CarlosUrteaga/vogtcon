version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    # Keep root uv focused on pyproject.toml and uv.lock; /examples manifests
    # are managed separately below or via scripts/compile_rag_requirements.sh.
    exclude-paths:
      - "examples/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    # Security updates bypass this version-update cooldown.
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/examples"
    # Keep automated pip updates for examples/requirements-cfdi.txt only.
    # RAG lockfiles are maintained from their .in manifests via
    # scripts/compile_rag_requirements.sh (uv 0.8.23, CPU backend, SHA-256 hashes)
    # and verified by CI (--check); Dependabot security alerts still apply.
    exclude-paths:
      - "**/requirements-langchain-rag.*"
      - "**/requirements-rag-build.*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    groups:
      cfdi-example:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
